<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PBSSP 2026 — przeglądarka metadanych</title>
  <meta name="description" content="Przeglądarka metadanych Programu Badań Statystycznych Statystyki Publicznej 2026: badania, zestawy, pakiety i zmienne." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="#/" class="logo" id="logo-link">
        <span class="logo-mark">PBSSP</span>
        <span class="logo-text">
          <strong>Program Badań Statystycznych</strong>
          <span>metadane 2026</span>
        </span>
      </a>
      <div class="header-counts" id="header-counts" aria-live="polite">
        <span class="counts-loading">Ładowanie danych…</span>
      </div>
    </div>
  </header>

  <nav class="breadcrumbs" id="breadcrumbs" aria-label="Ścieżka nawigacji"></nav>

  <main class="main" id="main">
    <div class="loading-panel" id="boot-loading">
      <div class="spinner" aria-hidden="true"></div>
      <p id="boot-status">Wczytywanie badań i zestawów…</p>
      <div class="progress-bar"><div class="progress-fill" id="boot-progress" style="width:10%"></div></div>
    </div>
  </main>

  <footer class="site-footer">
    <p>
      Dane ze scrapingu PBSSP 2026 (form.stat.gov.pl).
      Przeglądarka statyczna — badania, zestawy, pakiety i zmienne.
    </p>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
